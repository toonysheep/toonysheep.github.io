---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ page.lang | default: site.locale }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    {% if page.lang %}
      <link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}">
      <link rel="alternate" hreflang="zh-CN" href="{{ '/zh/' | absolute_url }}">
      <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
    {% endif %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
